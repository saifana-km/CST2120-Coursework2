<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cooking Corner</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">

            <!-- Logo -->
            <a href="index.html" class="logo-link">
                <img src="images/logo.svg" alt="Cooking Corner Logo" class="logo-img">
            </a>

            <!-- Search bar -->
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search recipes or users..." aria-label="Search">
                <button type="button" id="search-btn" aria-label="Search">
                    <img src="images/search.svg" alt="" class="search-icon">
                </button>
            </div>

            <!-- Navigation links -->
            <ul class="nav-links">
                <li><a href="index.html" class="current">Home</a></li>
                <li><a href="">Login</a></li>
                <li><a href="">Register</a></li>
                <li><a href="">Community</a></li>
            </ul>

        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="content-layout">

            <!-- Feed tabs -->
            <div class="feed-sections">
                <ul class="feed-links">
                    <li><a href="index.html" class="current">Your Feed</a></li>
                    <li><a href="">Trending</a></li>
                    <li><a href="">Latest</a></li>
                    <li><a href="">Following</a></li>
                </ul>

                <button type="button" id="post-btn" class="post-btn">+ Post</button>
            </div>

            <!-- Posts -->
            <section class="panel panel-main">
            </section>

            <!-- Sidebar -->
            <aside class="panel panel-side">
                <div class="side-header">
                    <h2>What's Cookin'</h2>
                    <img src="images/trend.svg" alt="" class="trend-img">
                </div>
            </aside>

        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-container">

            <!-- Social media links -->
            <div class="footer-socials">
                <a href="https://facebook.com" target="_blank" rel="noopener"><img src="images/fblogo.png" alt="Facebook"></a>
                <a href="https://instagram.com" target="_blank" rel="noopener"><img src="images/iglogo.png" alt="Instagram"></a>
                <a href="https://twitter.com" target="_blank" rel="noopener"><img src="images/xlogo.png" alt="Twitter"></a>
                <a href="https://discord.com" target="_blank" rel="noopener"><img src="images/dclogo.png" alt="Discord"></a>
            </div>

            <!-- Logo -->
            <div class="footer-logo">
                <img src="images/logo.svg" alt="Cooking Corner Logo" class="footer-logo-img">
            </div>

            <p class="footer-copyright">© 2026 The Cooking Corner. All Rights Reserved.</p>

        </div>
    </footer>

</body>
</html>
